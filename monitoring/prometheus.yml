global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

  external_labels:
    project: notifyflow
    environment: development

scrape_configs:
  - job_name: notifyflow-api
    static_configs:
      - targets:
          - 127.0.0.1:8000
        labels:
          component: api

  - job_name: notifyflow-push-consumer
    static_configs:
      - targets:
          - 127.0.0.1:9101
        labels:
          component: push-consumer

  - job_name: notifyflow-push-publisher
    static_configs:
      - targets:
          - 127.0.0.1:9102
        labels:
          component: push-publisher

  - job_name: notifyflow-sms-consumer
    static_configs:
      - targets:
          - 127.0.0.1:9103
        labels:
          component: sms-consumer

  - job_name: notifyflow-sms-publisher
    static_configs:
      - targets:
          - 127.0.0.1:9104
        labels:
          component: sms-publisher
